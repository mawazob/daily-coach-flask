<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Coach (Flask)</title>

    <style>
        body { font-family: Arial, sans-serif; max-width: 480px; margin: 40px auto; padding: 0 16px; }
        label { display: block; margin-top: 12px; font-weight: bold; }
        input { width: 100%; padding: 8px; box-sizing: border-box; margin-top: 4px; }
        button { margin-top: 16px; padding: 10px 16px; cursor: pointer; }
        button:disabled { cursor: not-allowed; opacity: 0.6; }
        #error { color: #b00020; margin-top: 12px; }
    </style>
</head>
<body>
    <h1>Daily Coach</h1>

    <label for="nameInput">Your name</label>
    <input id="nameInput" type="text" placeholder="Enter your name">

    <label for="sleepInput">Sleep hours</label>
    <input id="sleepInput" type="number" placeholder="e.g. 7" step="0.5">

    <label for="waterInput">Water glasses</label>
    <input id="waterInput" type="number" placeholder="e.g. 8">

    <label for="stepsInput">Steps</label>
    <input id="stepsInput" type="number" placeholder="e.g. 7000">

    <button id="btn">Get my coaching</button>

    <p id="error"></p>

    <p id="greet"></p>

    <h2 hidden>PREDICTION</h2>
    <p id="outcome"></p>

    <h2 hidden>COACHING</h2>
    <p id="message"></p>

    <!-- defer = run the script after the page has loaded, so every element exists -->
    <script src="script.js" defer></script>
</body>
</html>
